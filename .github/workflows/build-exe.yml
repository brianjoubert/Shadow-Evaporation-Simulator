name: Build Windows & Linux Desktop App (Electron + WebGL)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-electron:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact_name: Shadow_Evaporation_Simulator-Windows-x64
            artifact_glob: "dist/*.exe"
          - os: ubuntu-latest
            platform: linux
            artifact_name: Shadow_Evaporation_Simulator-Linux-x64
            artifact_glob: "dist/*.AppImage\ndist/*.deb"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Windows Portable .exe
        if: matrix.platform == 'win'
        run: npx electron-builder --win portable --publish never

      - name: Build Linux AppImage & .deb
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux AppImage deb --publish never

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

      - name: Publish Binaries to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Windows (.exe) & Linux (.AppImage / .deb) Builds
          body: "Automated Electron + WebGL builds for Windows (`.exe`) and Linux (`.AppImage`, `.deb`) from commit ${{ github.sha }}."
          prerelease: false
          files: ${{ matrix.artifact_glob }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
